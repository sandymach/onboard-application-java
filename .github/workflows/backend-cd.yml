name: Backend CD

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: eu-north-1
  ECR_REPOSITORY: ikanobank-onboarding-backend

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    if: ${{ vars.ENABLE_AWS_CD == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Test
        run: ./gradlew clean test --no-daemon

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        run: |
          IMAGE="${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "Published $IMAGE"

      # Keep deployment target explicit. For this assignment, enable one of these when the remote
      # environment exists and the AWS role has the exact permissions required.
      #
      # ECS example:
      # - name: Deploy to ECS
      #   run: |
      #     aws ecs update-service \
      #       --cluster "$ECS_CLUSTER" \
      #       --service "$ECS_SERVICE" \
      #       --force-new-deployment
      #
      # EC2/self-hosted example:
      # - name: Deploy to remote host
      #   run: |
      #     echo "Use SSM RunCommand or a self-hosted runner; do not store SSH keys casually."
