name: Backend CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Run tests
        run: ./gradlew clean test --no-daemon
      - name: Build Docker image
        run: docker build -t ikanobank-onboarding-backend:${{ github.sha }} .
