plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.7'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.flywaydb.flyway' version '10.20.1'
    id 'org.openapi.generator' version '7.24.0'
}

group = 'com.ikanobank'
version = '1.0.0'

java {
    toolchain { languageVersion = JavaLanguageVersion.of(17) }
}

repositories { mavenCentral() }

ext { set('awsSdkVersion', '2.31.68') }
ext { set('temporalVersion', '1.27.0') }

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.9'
    implementation 'com.google.protobuf:protobuf-java'
    implementation 'org.openapitools:jackson-databind-nullable:0.2.6'
    implementation platform("software.amazon.awssdk:bom:${awsSdkVersion}")
    implementation 'software.amazon.awssdk:auth'
    implementation 'software.amazon.awssdk:secretsmanager'
    implementation 'io.temporal:temporal-sdk:' + temporalVersion
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-mysql'
    implementation 'com.google.protobuf:protobuf-java:3.25.5'
    implementation 'com.google.protobuf:protobuf-java-util:3.25.5'
    runtimeOnly 'com.mysql:mysql-connector-j'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'io.temporal:temporal-testing:' + temporalVersion
    testRuntimeOnly 'com.h2database:h2'
}

sourceSets {
    main {
        java {
            srcDir "$buildDir/generated/openapi/src/main/java"
        }
    }
}

openApiValidate {
    inputSpec = "$rootDir/src/main/resources/specifications/onboarding-api.yaml"
}

openApiGenerate {
    generatorName = 'spring'
    inputSpec = "$rootDir/src/main/resources/specifications/onboarding-api.yaml"
    outputDir = "$buildDir/generated/openapi"
    apiPackage = 'com.ikanobank.onboarding.generated.api'
    modelPackage = 'com.ikanobank.onboarding.generated.model'
    invokerPackage = 'com.ikanobank.onboarding.generated'
    configOptions = [
            interfaceOnly       : 'true',
            useSpringBoot3      : 'true',
            useTags             : 'true',
            dateLibrary         : 'java8',
            skipDefaultInterface: 'true',
            useBeanValidation   : 'false',
            performBeanValidation: 'false'
    ]
}

compileJava.dependsOn tasks.openApiGenerate
tasks.named('test') {
    dependsOn tasks.openApiValidate
    useJUnitPlatform()
}

flyway {
    url = System.getenv('SPRING_DATASOURCE_URL') ?: 'jdbc:mysql://localhost:3306/ikanobank_onboarding?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC'
    user = System.getenv('SPRING_DATASOURCE_USERNAME') ?: 'ikano'
    password = System.getenv('SPRING_DATASOURCE_PASSWORD') ?: 'ikano'
    locations = ['filesystem:src/main/resources/db/migration/mysql']
}
