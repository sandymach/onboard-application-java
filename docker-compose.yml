services:
  app:
    build: .
    profiles: [ "app" ]
    ports:
      - "8080:8080"
    environment:
      - AWS_REGION=${AWS_REGION:-eu-north-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN:-}
      - IKANOBANK_DB_SECRET_ID=${IKANOBANK_DB_SECRET_ID:-application-db}
      - IKANOBANK_MOCK_DATA_PATH=${IKANOBANK_MOCK_DATA_PATH:-mock-data}
      - TEMPORAL_ENABLED=${TEMPORAL_ENABLED:-true}
      - TEMPORAL_TARGET=temporal:7233
      - TEMPORAL_NAMESPACE=${TEMPORAL_NAMESPACE:-default}
      - TEMPORAL_TASK_QUEUE=${TEMPORAL_TASK_QUEUE:-onboarding}
    volumes:
      - ./mock-data:/app/mock-data:ro
    depends_on:
      mysql:
        condition: service_healthy
      temporal:
        condition: service_started

  mysql:
    image: mysql:8.4
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=ikano_root
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -pikano_root --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  temporal:
    image: temporalio/auto-setup:1.29.7
    ports:
      - "7233:7233"
    environment:
      - DB=mysql8
      - DB_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PWD=ikano_root
      - MYSQL_SEEDS=mysql
    depends_on:
      mysql:
        condition: service_healthy

  temporal-ui:
    image: temporalio/ui:2.52.1
    ports:
      - "8088:8080"
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:8080
    depends_on:
      - temporal

